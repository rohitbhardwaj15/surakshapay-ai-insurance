<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SurakshaPay</title>
    <script type="module" crossorigin src="/assets/index-Btu4nDFC.js?v=20260404-4"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-C7t_QFPI.css?v=20260404-4">
  </head>
  <body>
    <div id="root"></div>
    <div id="suraksha-fallback" style="display:none;min-height:100vh;background:#070b14;color:#f4f7ff;font-family:Arial,sans-serif;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;">
      <h2 style="margin:0 0 12px 0;">SurakshaPay is refreshing</h2>
      <p style="margin:0 0 18px 0;color:#a9b3d2;">A stale browser cache was detected. Reset local session and continue.</p>
      <button id="suraksha-reset-btn" style="background:#4c6ef5;color:white;border:none;border-radius:8px;padding:10px 16px;cursor:pointer;">Reset and Reload</button>
    </div>
    <script>
      (function () {
        var root = document.getElementById("root");
        var fallback = document.getElementById("suraksha-fallback");
        var btn = document.getElementById("suraksha-reset-btn");
        var timer;

        function hasMountedApp() {
          return !!(root && root.children && root.children.length > 0);
        }

        function hideFallback() {
          if (fallback) fallback.style.display = "none";
        }

        function showFallback() {
          if (!root || !fallback) return;
          if (!hasMountedApp()) {
            fallback.style.display = "flex";
          }
        }

        btn && btn.addEventListener("click", function () {
          try {
            localStorage.clear();
            sessionStorage.clear();
            localStorage.removeItem("surakshapay_userId");
          } catch (e) {}
          location.href = "/?reset=" + Date.now();
        });

        // If app mounts late, keep fallback hidden.
        var observer = new MutationObserver(function () {
          if (hasMountedApp()) {
            hideFallback();
            if (timer) clearTimeout(timer);
          }
        });
        if (root) {
          observer.observe(root, { childList: true, subtree: true });
        }

        window.addEventListener("error", showFallback);
        window.addEventListener("unhandledrejection", showFallback);

        // Give app enough time to boot on slow connections.
        timer = setTimeout(showFallback, 15000);
      })();
    </script>
  </body>
</html>
